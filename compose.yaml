# c-logistics with SQLite. Start:
#   docker compose up -d --build        (or: podman-compose up -d --build)
# For Postgres instead of SQLite also pass compose.postgres.yaml, see there.
#
# Settings come from the file .env next to it (template: .env.example).
# The container only speaks HTTP; the reverse proxy in front does HTTPS.
services:
  app:
    build: .
    image: c-logistics
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      # Fixed in the container: database and photos live in the volume at /data.
      DJANGO_SQLITE_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/media
    volumes:
      - data:/data
    ports:
      # Only reachable locally; the reverse proxy forwards to here.
      # 27283 = "crate" on the phone keypad. Inside the container it stays port 8000.
      - "${APP_BIND:-127.0.0.1:27283}:8000"

volumes:
  data:
