# Add-on for Postgres instead of SQLite. Start:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
#   podman-compose -f compose.yaml -f compose.postgres.yaml up -d --build
#
# The .env has to contain POSTGRES_PASSWORD (letters, digits, - and _ only,
# because it is inserted into the database address unchanged).
# The photos stay in the volume `data`.
services:
  app:
    environment:
      DATABASE_URL: "postgres://crates:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/crates"
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: crates
      POSTGRES_USER: crates
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
