{% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
{% for field, errors in fields %}
<div class="mb-3">
  <label class="form-label"{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
</div>
{% endfor %}
{% for field in hidden_fields %}{{ field }}{% endfor %}
